<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Jarvis</title>
<style>
  :root {
    --bg: #03070c; --text: #e8f4fa; --muted: rgba(232,244,250,.62); --faint: rgba(232,244,250,.34);
    --line: rgba(120,200,230,.22); --panel: rgba(8,16,24,.82);
    --c-idle: #6fb9d4; --c-listen: #4ee6a1; --c-trans: #f2c94c; --c-think: #f29b3c; --c-speak: #3fd8ff; --c-off: #55606b;
    --accent: var(--c-idle);
  }
  body[data-state="listening"] { --accent: var(--c-listen); }
  body[data-state="transcribing"] { --accent: var(--c-trans); }
  body[data-state="thinking"] { --accent: var(--c-think); }
  body[data-state="speaking"] { --accent: var(--c-speak); }
  body[data-state="off"] { --accent: var(--c-off); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(ellipse at 50% 38%, #08151f 0%, var(--bg) 62%); color: var(--text);
         font: 15px/1.5 system-ui, "Segoe UI", sans-serif; overflow: hidden; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: pointer; }

  header { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px; padding: 16px 22px; pointer-events: none; }
  header > * { pointer-events: auto; }
  .brand { font-weight: 700; letter-spacing: .38em; text-transform: uppercase; font-size: 13px; }
  .state { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  body:not([data-state="idle"]):not([data-state="off"]) .dot { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
  .spacer { flex: 1; }
  .ghost { font: inherit; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); background: transparent;
           border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .ghost:hover, .ghost[aria-pressed="true"] { color: var(--text); border-color: var(--accent); }
  .ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .pending { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); padding: 7px 18px; border-radius: 999px; font-size: 13px; letter-spacing: .06em;
             color: var(--c-think); border: 1px solid var(--c-think); background: rgba(242,155,60,.10); animation: pulse 1.6s ease-in-out infinite; pointer-events: none; }
  .pending[hidden] { display: none; }
  .pending b { color: var(--text); font-weight: 600; }
  .stage { position: fixed; left: 50%; bottom: 128px; transform: translateX(-50%); width: min(920px, calc(100vw - 32px)); text-align: center; pointer-events: none; }
  .tools { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; min-height: 34px; margin-bottom: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 13px; border: 1px solid var(--line); border-radius: 999px;
          font-size: 12.5px; letter-spacing: .04em; background: rgba(255,255,255,.04); animation: rise .35s ease both; }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--c-think); animation: pulse 1s ease-in-out infinite; }
  .chip.done { color: var(--muted); } .chip.done i { background: var(--c-listen); animation: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .heard { color: var(--muted); font-size: 16px; min-height: 24px; margin-bottom: 8px; }
  .reply { font-size: clamp(19px, 2.3vw, 28px); line-height: 1.38; font-weight: 500; min-height: 40px; text-wrap: balance; }
  body.clean .stage { display: none; }

  .flow { position: fixed; left: 50%; bottom: 52px; transform: translateX(-50%); display: flex; align-items: center; gap: 0; }
  .node { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 112px; opacity: .42; transition: opacity .25s; }
  .node .ring { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; transition: all .25s; background: rgba(255,255,255,.02); }
  .node svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .node .nm { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; }
  .node .sub { font-size: 11px; color: var(--faint); min-height: 15px; white-space: nowrap; }
  .node.on { opacity: 1; color: var(--accent); }
  .node.on .ring { border-color: var(--accent); box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .node.on .sub { color: var(--muted); }
  .link { width: 34px; height: 1.5px; margin-top: -26px; background: repeating-linear-gradient(90deg, var(--line) 0 5px, transparent 5px 9px); }
  .link.on { background: repeating-linear-gradient(90deg, var(--accent) 0 5px, transparent 5px 9px); animation: flow .7s linear infinite; }
  @keyframes flow { to { background-position: 9px 0; } }

  .hint { position: fixed; left: 0; right: 0; bottom: 16px; text-align: center; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); pointer-events: none; }

  aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: var(--panel); backdrop-filter: blur(14px); border-left: 1px solid var(--line);
          transform: translateX(105%); transition: transform .3s ease; display: flex; flex-direction: column; z-index: 5; }
  body.drawer aside { transform: none; }
  aside h2 { margin: 0; padding: 18px 20px 12px; font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  #hist { flex: 1; overflow-y: auto; padding: 4px 18px 22px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; user-select: text; }
  .row { display: flex; flex-direction: column; max-width: 92%; }
  .row.me { align-self: flex-end; align-items: flex-end; } .row.jv { align-self: flex-start; }
  .bubble { padding: 9px 13px; border-radius: 13px; white-space: pre-wrap; word-wrap: break-word; font-size: 14px; }
  .me .bubble { background: color-mix(in srgb, var(--c-speak) 30%, #0b1a24); border-bottom-right-radius: 4px; }
  .jv .bubble { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .meta { font-size: 11px; color: var(--faint); margin: 3px 5px 0; }
  .divider { align-self: center; color: var(--faint); font-size: 11px; letter-spacing: .1em; display: flex; align-items: center; gap: 10px; width: 100%; text-transform: uppercase; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .empty { margin: auto; color: var(--faint); text-align: center; }
  .tabs { display: flex; gap: 6px; }
  .tab { font: inherit; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; background: transparent; color: var(--faint); border: 0; border-bottom: 2px solid transparent; padding: 4px 2px; margin-right: 10px; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #tasks { flex: 1; overflow-y: auto; padding: 4px 18px 22px; display: none; flex-direction: column; gap: 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  body.tab-tasks #tasks { display: flex; } body.tab-tasks #hist { display: none; }
  .task { display: flex; gap: 11px; align-items: flex-start; padding: 9px 12px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.04); cursor: pointer; text-align: left; font: inherit; color: var(--text); width: 100%; }
  .task:hover { border-color: var(--accent); }
  .task .box { flex: none; width: 17px; height: 17px; margin-top: 2px; border: 1.5px solid var(--muted); border-radius: 5px; display: grid; place-items: center; font-size: 12px; }
  .task.done { color: var(--faint); } .task.done .tx { text-decoration: line-through; } .task.done .box { background: var(--c-listen); border-color: var(--c-listen); color: #04210f; }
  .task .n { color: var(--faint); min-width: 1.4em; font-variant-numeric: tabular-nums; }
  .task .meta { font-size: 11.5px; color: var(--muted); margin-top: 1px; } .task .alta { color: var(--c-think); }
  .sec { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); margin: 10px 2px 2px; }

  @media (max-width: 640px) { .node { width: 74px; } .link { width: 14px; } .node .sub { display: none; } .stage { bottom: 120px; } }
  @media (prefers-reduced-motion: reduce) { .dot, .chip i, .link.on { animation: none; } }
</style>
</head>
<body data-state="off">
<canvas id="orb" role="img" aria-label="Esfera do Jarvis. Clique para falar com ele."></canvas>

<header>
  <span class="brand">Jarvis</span>
  <span class="state"><span class="dot"></span><span id="stateText">conectando</span></span>
  <span class="spacer"></span>
  <button class="ghost" id="btnDetails" aria-pressed="true">Detalhes</button>
  <button class="ghost" id="btnTasks" aria-pressed="false">Tarefas</button>
  <button class="ghost" id="btnHist" aria-pressed="false">Histórico</button>
</header>

<div class="pending" id="pending" role="status" hidden>Aguardando sua confirmação — diga <b>“confirma”</b> ou <b>“cancela”</b></div>

<div class="stage" aria-live="polite">
  <div class="tools" id="tools"></div>
  <div class="heard" id="heard"></div>
  <div class="reply" id="reply"></div>
</div>

<nav class="flow" aria-label="Etapas do Jarvis">
  <div class="node" data-for="listening">
    <div class="ring"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
    <span class="nm">Microfone</span><span class="sub" id="sub_listening">&nbsp;</span>
  </div>
  <div class="link" data-link="listening"></div>
  <div class="node" data-for="transcribing">
    <div class="ring"><svg viewBox="0 0 24 24"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2"/></svg></div>
    <span class="nm">Whisper</span><span class="sub" id="sub_transcribing">&nbsp;</span>
  </div>
  <div class="link" data-link="transcribing"></div>
  <div class="node" data-for="thinking">
    <div class="ring"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></div>
    <span class="nm">Claude</span><span class="sub" id="sub_thinking">&nbsp;</span>
  </div>
  <div class="link" data-link="thinking"></div>
  <div class="node" data-for="speaking">
    <div class="ring"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zM16.5 9a4.5 4.5 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/></svg></div>
    <span class="nm">Voz</span><span class="sub" id="sub_speaking">&nbsp;</span>
  </div>
</nav>
<div class="hint">Clique na esfera ou <b>Ctrl</b>+<b>Alt</b>+<b>J</b> para falar · <b>H</b> detalhes · <b>L</b> histórico</div>

<aside aria-label="Histórico e tarefas">
  <h2>
    <span class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabHist" aria-selected="true">Histórico</button>
      <button class="tab" role="tab" id="tabTasks" aria-selected="false">Tarefas</button>
    </span>
    <button class="ghost" id="btnClose">Fechar</button>
  </h2>
  <div id="hist"><div class="empty">Nenhuma conversa ainda.</div></div>
  <div id="tasks"><div class="empty">Nenhuma tarefa ainda.<br>Diga: “Jarvis, insira: … na lista de tarefas”.</div></div>
</aside>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const body = document.body;
  const LABEL = { off: 'desligado', idle: 'em espera', listening: 'ouvindo', transcribing: 'entendendo', thinking: 'trabalhando', speaking: 'falando' };
  const HUE = { off: [210, 8, 40], idle: [195, 55, 66], listening: [152, 75, 62], transcribing: [46, 90, 62], thinking: [30, 92, 60], speaking: [193, 100, 68] };
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let status = { state: 'off', level: 0, tools: [], heard: '', reply: '', rev: -1 };
  let lastRev = -2, online = false, drawerOpen = false;

  // ------------------------------------------------------------ dados
  async function poll() {
    try {
      const r = await fetch('/api/status', { cache: 'no-store' });
      status = await r.json(); online = true;
    } catch { online = false; status = { ...status, state: 'off', level: 0 }; }
    const st = online ? (status.state || 'idle') : 'off';
    body.dataset.state = st;
    $('stateText').textContent = LABEL[st] || st;
    renderStage(st);
    renderFlow(st);
    $('pending').hidden = !(online && status.pending);
    if (online && status.rev !== lastRev && (drawerOpen || lastRev === -2)) { lastRev = status.rev; loadHistory(); loadTasks(); }
  }
  setInterval(poll, 90); poll();

  function renderStage(st) {
    $('heard').textContent = status.heard ? 'Você: ' + status.heard : '';
    $('reply').textContent = status.reply || '';
    const groups = [];
    for (const t of status.tools || []) {
      const g = groups.find(x => x.label === t.label);
      if (g) { g.n++; g.done = g.done && t.done; } else groups.push({ label: t.label, n: 1, done: t.done });
    }
    const key = JSON.stringify(groups);
    if (renderStage.key === key) return; renderStage.key = key;
    const box = $('tools'); box.replaceChildren();
    for (const g of groups) {
      const c = document.createElement('span'); c.className = 'chip' + (g.done ? ' done' : '');
      c.append(document.createElement('i'), (g.label + (g.n > 1 ? ' ×' + g.n : '')));
      box.append(c);
    }
  }

  function renderFlow(st) {
    const order = ['listening', 'transcribing', 'thinking', 'speaking'];
    const idx = order.indexOf(st);
    document.querySelectorAll('.node').forEach(n => n.classList.toggle('on', n.dataset.for === st));
    // seta animada que sai da etapa ativa para a próxima
    document.querySelectorAll('.link').forEach(l => l.classList.toggle('on', order.indexOf(l.dataset.link) === idx));
    const n = (status.tools || []).length;
    const open = (status.tools || []).filter(t => !t.done).length;
    $('sub_listening').textContent = st === 'listening' ? 'ouvindo você' : ' ';
    $('sub_transcribing').textContent = st === 'transcribing' ? 'transcrevendo' : ' ';
    $('sub_thinking').textContent = st === 'thinking' ? (n ? `${n} ferramenta${n > 1 ? 's' : ''}${open ? ' · ' + open + ' ativa' + (open > 1 ? 's' : '') : ''}` : 'pensando') : ' ';
    $('sub_speaking').textContent = st === 'speaking' ? 'falando' : ' ';
  }

  async function loadHistory() {
    let items = [];
    try { items = await (await fetch('/api/history', { cache: 'no-store' })).json(); } catch { return; }
    const box = $('hist'); const bottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    box.replaceChildren();
    if (!items.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Nenhuma conversa ainda.'; box.append(e); return; }
    const fmt = ts => { try { return new Date(ts).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); } catch { return ts; } };
    const mk = (cls, text) => { const d = document.createElement('div'); d.className = cls; d.textContent = text; return d; };
    for (const it of items) {
      if (it.marker) { box.append(mk('divider', it.marker + ' · ' + fmt(it.ts))); continue; }
      const me = mk('row me', ''); me.append(mk('bubble', it.pergunta), mk('meta', 'Você · ' + fmt(it.ts)));
      const jv = mk('row jv', ''); jv.append(mk('bubble', it.resposta), mk('meta', 'Jarvis'));
      box.append(me, jv);
    }
    if (bottom) box.scrollTop = box.scrollHeight;
  }

  // ------------------------------------------------------------ controles
  async function loadTasks() {
    let d; try { d = await (await fetch('/api/tarefas', { cache: 'no-store' })).json(); } catch { return; }
    const box = $('tasks'); box.replaceChildren();
    const mk = (cls, text, tag) => { const e = document.createElement(tag || 'div'); e.className = cls; if (text !== undefined) e.textContent = text; return e; };
    const fmtPrazo = p => { if (!p) return ''; const d0 = new Date(p + 'T00:00:00'), h = new Date(); h.setHours(0,0,0,0); const k = Math.round((d0 - h) / 864e5); return k === 0 ? 'hoje' : k === 1 ? 'amanhã' : k < 0 ? 'atrasada · ' + d0.toLocaleDateString('pt-BR') : d0.toLocaleDateString('pt-BR'); };
    if (!d.abertas.length && !d.concluidas.length) { const e = mk('empty'); e.append('Nenhuma tarefa ainda.', document.createElement('br'), 'Diga: “Jarvis, insira: … na lista de tarefas”.'); box.append(e); return; }
    box.append(mk('sec', 'Abertas (' + d.abertas.length + ')'));
    for (const t of d.abertas) {
      const b = mk('task', undefined, 'button'); b.type = 'button'; b.title = 'Clique para concluir';
      const meta = [t.prioridade === 'alta' ? 'prioridade alta' : '', fmtPrazo(t.prazo)].filter(Boolean).join(' · ');
      const tx = mk('div'); tx.append(mk('tx', t.texto)); if (meta) tx.append(mk('meta' + (t.prioridade === 'alta' ? ' alta' : ''), meta));
      b.append(mk('box', ''), mk('n', t.n + '.'), tx);
      b.onclick = async () => { await fetch('/api/tarefas/concluir', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: t.id }) }).catch(() => {}); loadTasks(); };
      box.append(b);
    }
    if (d.concluidas.length) {
      box.append(mk('sec', 'Concluídas recentemente'));
      for (const t of d.concluidas) { const b = mk('task done', undefined, 'div'); const bx = mk('box', '✓'); const tx = mk('div'); tx.append(mk('tx', t.texto)); b.append(bx, tx); b.style.cursor = 'default'; box.append(b); }
    }
  }
  function setTab(nome) { body.classList.toggle('tab-tasks', nome === 'tasks'); $('tabHist').setAttribute('aria-selected', String(nome !== 'tasks')); $('tabTasks').setAttribute('aria-selected', String(nome === 'tasks')); }
  function setDrawer(on, tab) { if (tab) setTab(tab); drawerOpen = on; body.classList.toggle('drawer', on); $('btnHist').setAttribute('aria-pressed', String(on && tab !== 'tasks')); $('btnTasks').setAttribute('aria-pressed', String(on && tab === 'tasks')); if (on) { lastRev = -2; poll(); } }
  function setDetails(on) { body.classList.toggle('clean', !on); $('btnDetails').setAttribute('aria-pressed', String(on)); try { localStorage.setItem('jarvis-details', on ? '1' : '0'); } catch {} }
  $('btnHist').onclick = () => setDrawer(!(drawerOpen && !body.classList.contains('tab-tasks')), 'hist');
  $('btnTasks').onclick = () => setDrawer(!(drawerOpen && body.classList.contains('tab-tasks')), 'tasks');
  $('tabHist').onclick = () => setTab('hist'); $('tabTasks').onclick = () => setTab('tasks');
  $('btnClose').onclick = () => setDrawer(false);
  $('btnDetails').onclick = () => setDetails(body.classList.contains('clean'));
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'h' || e.key === 'H') setDetails(body.classList.contains('clean'));
    if (e.key === 'l' || e.key === 'L') setDrawer(!drawerOpen, 'hist');
    if (e.key === 't' || e.key === 'T') setDrawer(!(drawerOpen && body.classList.contains('tab-tasks')), 'tasks');
    if (e.key === 'Escape') setDrawer(false);
  });
  try { if (localStorage.getItem('jarvis-details') === '0') setDetails(false); } catch {}
  $('orb').addEventListener('click', () => {
    if (!online) return;
    fetch('/api/hotkey', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => {});
  });

  // ------------------------------------------------------------ esfera
  const cv = $('orb'), ctx = cv.getContext('2d');
  let W = 0, H = 0;
  const fit = () => { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
  addEventListener('resize', fit); fit();

  const N = 1900, pts = [];
  for (let i = 0; i < N; i++) {                 // distribuição uniforme (espiral de Fibonacci)
    const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963229728653;
    pts.push([Math.cos(th) * r, y, Math.sin(th) * r, Math.random() * 6.2832]);
  }
  const RING = 150;                              // anéis orbitais (aparecem ao trabalhar)

  let lvl = 0, rot = 0, spin = 0.0025, ringAmt = 0, hsl = [...HUE.off];
  const t0 = performance.now();

  let last = performance.now();
  function frame(now) {
    // suavização por tempo (não por quadro): o painel reduz a taxa de quadros em segundo plano
    const dt = Math.min(10, Math.max(0.2, (now - last) / 16.667)); last = now;
    const ease = k => 1 - Math.pow(1 - k, dt);
    const t = (now - t0) / 1000, st = body.dataset.state;
    const working = st === 'thinking' || st === 'transcribing';
    let target = st === 'listening' || st === 'speaking' ? (status.level || 0)
      : working ? 0.2 + 0.12 * Math.sin(t * 3.2) : 0.04 + 0.025 * Math.sin(t * 1.1);
    if (st === 'listening') target = Math.max(target, 0.07 + 0.035 * Math.sin(t * 4));  // mic com noise gate: continua "vivo" ouvindo
    if (REDUCE) target *= 0.35;
    lvl += (target - lvl) * ease(0.38);

    const sAlvo = working ? 0.016 : st === 'speaking' ? 0.007 : st === 'off' ? 0.0008 : 0.0026;
    spin += (sAlvo - spin) * ease(0.05); rot += (REDUCE ? spin * 0.3 : spin) * dt;
    ringAmt += ((working ? 1 : 0) - ringAmt) * ease(0.06);
    const hu = HUE[st] || HUE.idle;
    for (let k = 0; k < 3; k++) hsl[k] += (hu[k] - hsl[k]) * ease(0.12);
    const col = `hsl(${hsl[0]} ${hsl[1]}% ${hsl[2]}%)`;

    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H * 0.4, R = Math.min(W * 0.9, H) * 0.2 * (1 + lvl * 0.28);

    const g = ctx.createRadialGradient(cx, cy, R * 0.05, cx, cy, R * 2.3);
    g.addColorStop(0, `hsl(${hsl[0]} ${hsl[1]}% ${hsl[2]}% / ${0.10 + lvl * 0.26})`);
    g.addColorStop(0.45, `hsl(${hsl[0]} ${hsl[1]}% ${hsl[2]}% / ${0.03 + lvl * 0.06})`);
    g.addColorStop(1, `hsl(${hsl[0]} ${hsl[1]}% ${hsl[2]}% / 0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    const cr = Math.cos(rot), sr = Math.sin(rot), inc = 0.42, ci = Math.cos(inc), si = Math.sin(inc);
    const force = st === 'speaking' || st === 'listening' ? 0.62 : 0.34;
    ctx.fillStyle = col;
    for (let i = 0; i < N; i++) {
      const p = pts[i];
      const w = 1 + lvl * force * Math.sin(p[3] + t * 6 + p[1] * 5);
      const x = p[0] * w, y = p[1] * w, z = p[2] * w;
      const x1 = x * cr + z * sr, z1 = -x * sr + z * cr;
      const y1 = y * ci - z1 * si, z2 = y * si + z1 * ci;
      const depth = (z2 + 1.3) / 2.6, sc = 1.4 / (1.9 - z2 * 0.5), sz = (0.6 + 1.5 * depth) * (1 + lvl * 0.3);
      ctx.globalAlpha = Math.max(0.05, Math.min(1, 0.07 + 0.9 * depth * depth));
      ctx.fillRect(cx + x1 * R * sc - sz / 2, cy + y1 * R * sc - sz / 2, sz, sz);
    }
    if (ringAmt > 0.02) {                          // dois anéis girando em eixos diferentes = "processando"
      for (let k = 0; k < 2; k++) {
        const tilt = k ? 1.1 : -0.5, sp = (k ? -1 : 1) * t * (1.1 + k * 0.4);
        for (let i = 0; i < RING; i++) {
          const a = (i / RING) * 6.2832 + sp, rr = 1.32 + k * 0.16;
          let x = Math.cos(a) * rr, y = Math.sin(a) * rr * Math.cos(tilt), z = Math.sin(a) * rr * Math.sin(tilt);
          const dpt = (z + 1.6) / 3.2; ctx.globalAlpha = ringAmt * (0.12 + 0.75 * dpt);
          const s = 0.9 + 1.4 * dpt; ctx.fillRect(cx + x * R - s / 2, cy + y * R - s / 2, s, s);
        }
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
