[package]
name = "jarvis-overlay"
version = "0.1.0"
description = "Esfera flutuante do Jarvis (so exibe; o raciocinio fica no jarvis.py + Claude)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
strip = true
