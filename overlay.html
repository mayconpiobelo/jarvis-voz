<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis Overlay</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body.debug { background: #0a141d; }               /* ?bg=1 : fundo para testar no navegador */
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="orb"></canvas>
<script>
(() => {
  if (new URLSearchParams(location.search).has('bg')) document.body.classList.add('debug');
  const HUE = { idle: [195, 55, 66], listening: [152, 75, 62], transcribing: [46, 90, 62], thinking: [30, 92, 60], speaking: [193, 100, 68], pending: [30, 92, 60] };
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LINGER_MS = 1600;                          // fica visivel um instante depois de terminar

  let status = { state: 'idle', level: 0, pending: false }, online = false, lastActive = 0;

  async function poll() {
    try { status = await (await fetch('/api/status', { cache: 'no-store' })).json(); online = true; }
    catch { online = false; }
    const active = online && (status.state !== 'idle' || status.pending);
    if (active) lastActive = performance.now();
  }
  setInterval(poll, 90); poll();

  const cv = document.getElementById('orb'), ctx = cv.getContext('2d');
  let W = 0, H = 0;
  const fit = () => { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
  addEventListener('resize', fit); fit();

  const N = 1500, pts = [];
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963229728653;
    pts.push([Math.cos(th) * r, y, Math.sin(th) * r, Math.random() * 6.2832]);
  }
  const RING = 130;
  let lvl = 0, rot = 0, spin = 0.0025, ringAmt = 0, alpha = 0, hsl = [...HUE.idle];
  const t0 = performance.now(); let last = t0;

  function frame(now) {
    const dt = Math.min(10, Math.max(0.2, (now - last) / 16.667)); last = now;
    const ease = k => 1 - Math.pow(1 - k, dt);
    const t = (now - t0) / 1000;
    const st = status.state || 'idle';
    const key = st === 'idle' && status.pending ? 'pending' : st;
    const working = st === 'thinking' || st === 'transcribing';
    const visible = online && (now - lastActive) < LINGER_MS;

    alpha += ((visible ? 1 : 0) - alpha) * ease(visible ? 0.28 : 0.12);   // surge rapido, some devagar
    ctx.clearRect(0, 0, W, H);
    if (alpha < 0.01) { requestAnimationFrame(frame); return; }           // totalmente invisivel: nao desenha

    let target = st === 'listening' || st === 'speaking' ? (status.level || 0)
      : working ? 0.2 + 0.12 * Math.sin(t * 3.2) : key === 'pending' ? 0.1 + 0.07 * Math.sin(t * 2.6) : 0.05;
    if (st === 'listening') target = Math.max(target, 0.07 + 0.035 * Math.sin(t * 4));
    if (REDUCE) target *= 0.35;
    lvl += (target - lvl) * ease(0.38);
    const sAlvo = working ? 0.016 : st === 'speaking' ? 0.007 : 0.0026;
    spin += (sAlvo - spin) * ease(0.05); rot += (REDUCE ? spin * 0.3 : spin) * dt;
    ringAmt += (((working || key === 'pending') ? 1 : 0) - ringAmt) * ease(0.06);
    const hu = HUE[key] || HUE.idle;
    for (let k = 0; k < 3; k++) hsl[k] += (hu[k] - hsl[k]) * ease(0.12);

    const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.3 * (1 + lvl * 0.28);
    const g = ctx.createRadialGradient(cx, cy, R * 0.05, cx, cy, R * 2.1);
    g.addColorStop(0, `hsl(${hsl[0]} ${hsl[1]}% ${hsl[2]}% / ${(0.12 + lvl * 0.28) * alpha})`);
    g.addColorStop(0.5, `hsl(${hsl[0]} ${hsl[1]}% ${hsl[2]}% / ${(0.035 + lvl * 0.07) * alpha})`);
    g.addColorStop(1, `hsl(${hsl[0]} ${hsl[1]}% ${hsl[2]}% / 0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    const cr = Math.cos(rot), sr = Math.sin(rot), inc = 0.42, ci = Math.cos(inc), si = Math.sin(inc);
    const force = st === 'speaking' || st === 'listening' ? 0.62 : 0.34;
    ctx.fillStyle = `hsl(${hsl[0]} ${hsl[1]}% ${hsl[2]}%)`;
    for (let i = 0; i < N; i++) {
      const p = pts[i];
      const w = 1 + lvl * force * Math.sin(p[3] + t * 6 + p[1] * 5);
      const x = p[0] * w, y = p[1] * w, z = p[2] * w;
      const x1 = x * cr + z * sr, z1 = -x * sr + z * cr;
      const y1 = y * ci - z1 * si, z2 = y * si + z1 * ci;
      const depth = (z2 + 1.3) / 2.6, sc = 1.4 / (1.9 - z2 * 0.5), sz = (0.7 + 1.6 * depth) * (1 + lvl * 0.3);
      ctx.globalAlpha = Math.max(0.05, Math.min(1, 0.07 + 0.9 * depth * depth)) * alpha;
      ctx.fillRect(cx + x1 * R * sc - sz / 2, cy + y1 * R * sc - sz / 2, sz, sz);
    }
    if (ringAmt > 0.02) {
      for (let k = 0; k < 2; k++) {
        const tilt = k ? 1.1 : -0.5, sp = (k ? -1 : 1) * t * (1.1 + k * 0.4);
        for (let i = 0; i < RING; i++) {
          const a = (i / RING) * 6.2832 + sp, rr = 1.32 + k * 0.16;
          const x = Math.cos(a) * rr, y = Math.sin(a) * rr * Math.cos(tilt), z = Math.sin(a) * rr * Math.sin(tilt);
          const dpt = (z + 1.6) / 3.2; ctx.globalAlpha = ringAmt * alpha * (0.12 + 0.75 * dpt);
          const s = 1 + 1.5 * dpt; ctx.fillRect(cx + x * R - s / 2, cy + y * R - s / 2, s, s);
        }
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
