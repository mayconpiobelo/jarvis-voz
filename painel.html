<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Jarvis — Painel</title>
<style>
  :root {
    --text: #eaf1fb; --muted: #8fa1ba; --faint: #5d6f88; --line: rgba(255,255,255,.075);
    --ac1: #4dd5ff; --ac2: #7c5cff; --grad: linear-gradient(135deg, var(--ac1), var(--ac2));
    --ok: #34d399; --warn: #fbbf24; --bad: #fb7185; --mc: #1db954;
    --glass: linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.028));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body.debug { background: #05070b; }
  body { color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; user-select: none; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }   /* o display dos componentes nao pode anular o atributo hidden */
  :focus-visible { outline: 2px solid var(--ac1); outline-offset: 2px; border-radius: 9px; }
  svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---- casca: degrade profundo com brilhos suaves ---- */
  #shell { position: fixed; inset: 8px; border-radius: 24px; padding: 10px; border: 1px solid rgba(255,255,255,.09);
           background:
             radial-gradient(90% 70% at 0% 0%, rgba(40,120,170,.34) 0%, transparent 60%),
             radial-gradient(80% 70% at 100% 100%, rgba(110,70,220,.30) 0%, transparent 62%),
             linear-gradient(160deg, #0e1726 0%, #090d16 100%);
           box-shadow: 0 24px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.07);
           display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; transform-origin: 50% 40%; }
  #shell.entra { animation: entra .22s cubic-bezier(.2,.8,.2,1); }
  @keyframes entra { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
  /* colunas: duas lado a lado; se a janela ficar estreita viram uma so, com rolagem */
  .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); grid-template-rows: minmax(min-content, 1fr);
          gap: 10px; overflow-y: auto; overflow-x: hidden; margin: 0 -4px; padding: 0 4px; scrollbar-width: thin; scrollbar-color: #2a3a52 transparent; }
  .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  @media (max-width: 640px) { .cols { grid-template-columns: minmax(0,1fr); grid-template-rows: none; } #cTarefas { flex: none; min-height: 240px; } }
  /* alcas invisiveis nas bordas e cantos: arrastar redimensiona (so dentro do app Tauri) */
  .rz { position: fixed; z-index: 50; }
  .rz.n, .rz.s { left: 14px; right: 14px; height: 9px; cursor: ns-resize; } .rz.n { top: 0; } .rz.s { bottom: 0; }
  .rz.e, .rz.w { top: 14px; bottom: 14px; width: 9px; cursor: ew-resize; } .rz.e { right: 0; } .rz.w { left: 0; }
  .rz.ne, .rz.nw, .rz.se, .rz.sw { width: 16px; height: 16px; } .rz.ne { top: 0; right: 0; cursor: nesw-resize; } .rz.nw { top: 0; left: 0; cursor: nwse-resize; }
  .rz.se { bottom: 0; right: 0; cursor: nwse-resize; } .rz.sw { bottom: 0; left: 0; cursor: nesw-resize; }
  body:not(.tauri) .rz { display: none; }
  .grip { position: absolute; right: 10px; bottom: 10px; width: 12px; height: 12px; opacity: .35; pointer-events: none;
          background: linear-gradient(135deg, transparent 52%, var(--muted) 52% 60%, transparent 60% 72%, var(--muted) 72% 80%, transparent 80%); }
  body:not(.tauri) .grip { display: none; }
  .card { background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; position: relative; overflow: hidden;
          box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 6px 18px rgba(0,0,0,.25); min-height: 0; }
  .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .17em; text-transform: uppercase; color: var(--ac1); opacity: .85; display: flex; align-items: center; gap: 7px; }
  .lbl svg.i { width: 14px; height: 14px; }
  .sp { flex: 1; }
  .ib { width: 28px; height: 28px; border-radius: 9px; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  .ib:hover { background: rgba(255,255,255,.09); color: var(--text); } .ib[aria-pressed="true"] { color: var(--ac1); background: rgba(77,213,255,.12); }

  /* ---- barra superior ---- */
  .top { flex: none; height: 24px; display: flex; align-items: center; gap: 9px; padding: 0 4px; position: relative; }
  body.tauri .top { cursor: grab; } body.tauri .top:active { cursor: grabbing; } .top .ib { cursor: pointer; }
  .top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 1px; background: linear-gradient(90deg, var(--ac1), var(--ac2) 55%, transparent); opacity: .5; }
  .marca { font-weight: 800; letter-spacing: .34em; font-size: 11.5px; display: flex; align-items: center; gap: 9px; }
  .marca i { width: 7px; height: 7px; border-radius: 50%; background: var(--ac1); box-shadow: 0 0 12px var(--ac1); }
  #pinTxt { color: var(--muted); font-size: 11px; letter-spacing: .1em; }

  /* ---- tarefas ---- */
  #cTarefas { flex: 1; min-height: 190px; display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .qtd { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: rgba(77,213,255,.14); color: var(--ac1); }
  #lista { flex: 1; min-height: 70px; overflow-y: auto; margin: 0 -8px; padding: 0 8px; scrollbar-width: thin; scrollbar-color: #2a3a52 transparent; }
  .tarefa { display: flex; gap: 11px; align-items: flex-start; padding: 8px 6px; border-radius: 11px; position: relative; }
  .tarefa + .tarefa { border-top: 1px solid rgba(255,255,255,.04); }
  .tarefa:hover { background: rgba(255,255,255,.04); } .tarefa:hover .rm { opacity: 1; }
  .tarefa.sel { background: rgba(77,213,255,.10); box-shadow: inset 2px 0 0 var(--ac1); }
  .tarefa.alta::before { content: ""; position: absolute; left: -2px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--warn); }
  .ck { width: 19px; height: 19px; flex: none; margin-top: 1px; border-radius: 50%; border: 1.6px solid #46586f; background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; transition: .15s; }
  .ck:hover { border-color: var(--ok); box-shadow: 0 0 0 4px rgba(52,211,153,.12); }
  .ck svg { width: 11px; height: 11px; stroke: #052e1f; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  .feita .ck { background: var(--ok); border-color: var(--ok); } .feita .ck svg { opacity: 1; }
  .feita .tx { color: var(--faint); text-decoration: line-through; }
  .corpo { flex: 1; min-width: 0; }
  .tx { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; }
  .chip { font-size: 10.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: rgba(255,255,255,.07); color: var(--muted); }
  .chip.hoje { background: rgba(251,191,36,.15); color: var(--warn); } .chip.atras { background: rgba(251,113,133,.16); color: var(--bad); }
  .chip.amanha { background: rgba(77,213,255,.14); color: var(--ac1); } .chip.alta { background: rgba(251,191,36,.12); color: var(--warn); }
  .rm { opacity: 0; border: 0; background: transparent; color: var(--faint); cursor: pointer; width: 22px; height: 22px; border-radius: 7px; flex: none; font-size: 11px; }
  .rm:hover { color: var(--bad); background: rgba(251,113,133,.14); } .rm:focus-visible { opacity: 1; }
  .vazio { color: var(--faint); text-align: center; padding: 22px 8px; }
  .conc { color: var(--faint); font-size: 11.5px; background: transparent; border: 0; cursor: pointer; padding: 4px 6px; text-align: left; }
  .conc:hover { color: var(--text); }
  .nova { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid var(--line); transition: .15s; }
  .nova:focus-within { border-color: rgba(77,213,255,.55); box-shadow: 0 0 0 4px rgba(77,213,255,.10); }
  .nova svg.i { color: var(--faint); }
  .nova input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text); font: inherit; font-weight: 600; outline: none; user-select: text; }
  .nova input::placeholder { color: var(--faint); font-weight: 500; }
  .quando { margin-top: 6px; padding: 9px 11px; border-radius: 12px; background: rgba(77,213,255,.08); border: 1px solid rgba(77,213,255,.3); }
  .quando .qq { font-size: 11.5px; font-weight: 700; color: var(--ac1); } .quando .qq small { color: var(--faint); font-weight: 500; margin-left: 4px; }
  .qb { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .qb button { border: 1px solid var(--line); background: rgba(255,255,255,.07); border-radius: 99px; padding: 4px 11px; cursor: pointer; font-size: 11.5px; font-weight: 600; transition: .15s; }
  .qb button:hover { background: rgba(255,255,255,.15); } .qb button.sem { color: var(--muted); }
  .qb input { flex: 1; min-width: 96px; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px; color: var(--text); font: inherit; font-size: 11.5px; outline: none; user-select: text; }
  .qb input:focus { border-color: rgba(77,213,255,.55); } .qb input::placeholder { color: var(--faint); }
  .aviso { font-size: 11px; color: var(--ok); min-height: 15px; margin-top: 4px; padding-left: 4px; } .aviso.erro { color: var(--bad); }

  /* ---- hoje ---- */
  #cHoje { flex: none; display: flex; flex-direction: column; }
  .linha { display: flex; align-items: baseline; gap: 10px; }
  .hora { font-size: 46px; line-height: 1; font-weight: 700; letter-spacing: -1.5px; font-variant-numeric: tabular-nums;
          background: linear-gradient(180deg, #ffffff 20%, #9db3d0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-top: 4px; }
  .dts { color: var(--muted); font-weight: 600; font-size: 12.5px; line-height: 1.25; }
  .barra { height: 4px; border-radius: 99px; background: rgba(255,255,255,.09); overflow: hidden; } .barra i { display: block; height: 100%; background: var(--grad); border-radius: 99px; transition: width .6s; }
  .clima { display: flex; align-items: center; gap: 8px; margin-top: 7px; font-size: 12px; color: var(--muted); min-width: 0; }
  .clima svg.i { width: 19px; height: 19px; color: var(--ac1); } .clima.dia svg.i { color: var(--warn); }
  .clima b { color: var(--text); font-size: 16px; font-variant-numeric: tabular-nums; } .clima .ct { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hojeinfo { font-size: 12px; color: var(--muted); margin: 6px 0 8px; } .hojeinfo b { color: var(--text); } .hojeinfo .r { color: var(--bad); }
  .mini { display: grid; grid-template-columns: 30px 1fr 32px; gap: 8px; align-items: center; font-size: 10.5px; color: var(--muted); font-weight: 700; letter-spacing: .08em; margin-top: 4px; }
  .mini span:last-child { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  .mini .barra i.cpu { background: linear-gradient(90deg, var(--ok), #a3e635); } .mini .barra i.mem { background: var(--grad); }
  .up { font-size: 10.5px; color: var(--faint); margin-top: auto; padding-top: 4px; }

  /* ---- uso do Claude (sessao de 5 h e semana) ---- */
  #cUso { flex: none; }
  #cUso .head { margin-bottom: 0; } .uplano { font-size: 10.5px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: rgba(124,92,255,.18); color: #b9a8ff; }
  .uatual { font-size: 10.5px; color: var(--faint); }
  .uso-linha { margin-top: 10px; }
  .uso-topo { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
  .uso-nome { font-weight: 700; } .uso-pct { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; }
  .uso-pct.atencao { color: var(--warn); } .uso-pct.critico { color: var(--bad); }
  .uso-barra { height: 7px; border-radius: 99px; background: rgba(255,255,255,.09); overflow: hidden; display: flex; margin-top: 5px; }
  .uso-barra i { display: block; height: 100%; transition: width .6s; }
  .uso-barra i.normal { background: var(--grad); } .uso-barra i.atencao { background: var(--warn); } .uso-barra i.critico { background: var(--bad); }
  .uso-barra i + i { box-shadow: -1px 0 0 rgba(8,12,20,.9); }
  .uso-sub { font-size: 11px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .uso-leg { display: flex; flex-wrap: wrap; gap: 3px 11px; margin-top: 5px; font-size: 10.5px; color: var(--muted); }
  .uso-leg span { display: inline-flex; align-items: center; gap: 5px; } .uso-leg span i { width: 7px; height: 7px; border-radius: 50%; }
  .uso-nota { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.35; } .uso-nota.velho { color: var(--warn); }

  /* ---- musica ---- */
  #cMusica { flex: none; display: grid; grid-template-columns: 76px 1fr; grid-template-rows: auto auto auto; gap: 2px 14px; align-content: center;
             background: linear-gradient(135deg, color-mix(in srgb, var(--mc) 42%, #0b1220) 0%, rgba(11,18,32,.55) 75%), var(--glass); transition: background .6s; }
  #capa, .capa0 { width: 76px; height: 76px; border-radius: 14px; object-fit: cover; box-shadow: 0 8px 22px rgba(0,0,0,.5); background: rgba(255,255,255,.07); display: grid; place-items: center; color: var(--faint); }
  .capa0 svg.i { width: 28px; height: 28px; }
  #capa { grid-column: 1; grid-row: 1 / 3; }
  .mt { grid-column: 2; grid-row: 1; align-self: end; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px; }
  .mapp { font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: color-mix(in srgb, var(--mc) 70%, #fff); display: flex; align-items: center; gap: 6px; }
  .mapp i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); } .mapp i.off { background: var(--faint); box-shadow: none; }
  .mtit { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mart { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mprog { grid-column: 1 / -1; grid-row: 3; margin-top: 8px; display: grid; grid-template-columns: 34px 1fr 34px; gap: 8px; align-items: center; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mprog span:last-child { text-align: right; } .mprog .barra { height: 4px; } .mprog .barra i { background: color-mix(in srgb, var(--mc) 55%, #fff); transition: width .25s linear; }
  .mctl { grid-column: 2; grid-row: 2; align-self: start; display: flex; align-items: center; justify-content: flex-start; gap: 10px; margin-top: 4px; }
  .mctl button { border: 0; background: transparent; color: var(--text); cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
  .mctl button:hover { background: rgba(255,255,255,.1); } .mctl button:disabled { opacity: .3; cursor: default; background: transparent; }
  .mctl button.pp { width: 36px; height: 36px; background: #fff; color: #0b1220; } .mctl button.pp:hover { background: #e6eefb; } .mctl button.pp:disabled { background: rgba(255,255,255,.25); }
  .mctl svg.i { width: 18px; height: 18px; fill: currentColor; stroke: none; }
  .mvazio { grid-column: 1 / -1; grid-row: 1 / 4; display: flex; align-items: center; gap: 12px; color: var(--muted); }
  .mvazio .capa0 { flex: none; } .mvazio small { color: var(--faint); display: block; }
  .mvazio button { margin-left: auto; border: 0; border-radius: 10px; padding: 7px 12px; background: rgba(255,255,255,.1); cursor: pointer; font-weight: 600; } .mvazio button:hover { background: rgba(255,255,255,.17); }

  /* ---- jarvis ---- */
  #cJarvis { flex: 1; min-height: 150px; display: grid; grid-template-columns: 78px 1fr; gap: 4px 12px; align-items: center; align-content: start; }
  #orb { width: 78px; height: 78px; display: block; }
  .jstate { display: flex; align-items: center; gap: 7px; font-weight: 700; } .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ac1); box-shadow: 0 0 10px var(--ac1); }
  .jreply { color: var(--muted); font-size: 12px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .jbtns { grid-column: 1 / -1; display: flex; gap: 8px; }
  .pill { flex: 1; border: 1px solid var(--line); border-radius: 11px; padding: 8px 10px; background: rgba(255,255,255,.06); cursor: pointer; font-weight: 600; display: flex; gap: 7px; align-items: center; justify-content: center; transition: .15s; }
  .pill:hover { background: rgba(255,255,255,.12); } .pill.prim { background: var(--grad); border-color: transparent; color: #04101c; } .pill.prim:hover { filter: brightness(1.1); }
  .pend { grid-column: 1 / -1; color: var(--warn); font-size: 11.5px; font-weight: 600; }

  /* ---- atalhos ---- */
  #cAtalhos { flex: none; }
  .tiles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tile { width: 70px; border: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 2px; border-radius: 13px; font-size: 11px; font-weight: 600; color: var(--muted); transition: .15s; }
  .tile:hover { background: rgba(255,255,255,.07); color: var(--text); transform: translateY(-1px); }
  .tile .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ac1); }
  .tile.add .ic { border-style: dashed; color: var(--faint); background: transparent; }
  .tile span:last-child { max-width: 70px; line-height: 1.15; text-align: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="shell">
  <div class="top">
    <span class="marca"><i></i>JARVIS</span><span id="pinTxt"></span><span class="sp"></span>
    <button class="ib" id="btnRest" title="Restaurar posição e tamanho (duplo clique na barra também)" aria-label="Restaurar posição e tamanho do painel"><svg class="i" viewBox="0 0 24 24"><path d="M4 4v6h6M20 20v-6h-6M5 14a8 8 0 0013 3M19 10A8 8 0 006 7"/></svg></button>
    <button class="ib" id="btnPin" aria-pressed="false" title="Fixar (não fecha ao clicar fora)" aria-label="Fixar painel"><svg class="i" viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 7 3 3H7l3-3-1-7z"/></svg></button>
    <button class="ib" id="btnFechar" title="Fechar (Esc)" aria-label="Fechar painel"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <div class="cols">
  <div class="col esq">
  <section class="card" id="cTarefas" aria-label="Tarefas">
    <div class="head">
      <span class="lbl"><svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Tarefas</span><span class="qtd" id="nAbertas">0</span><span class="sp"></span>
      <button class="ib" id="btnDesfazer" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button class="ib" id="btnMais" title="Nova tarefa (/)" aria-label="Nova tarefa"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div id="lista" role="list" aria-label="Tarefas abertas"></div>
    <button class="conc" id="btnConc" hidden></button>
    <div class="nova"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <input id="entrada" type="text" maxlength="300" autocomplete="off" spellcheck="false" aria-label="Nova tarefa" placeholder="Nova tarefa… ex.: revisar contrato para sexta urgente"></div>
    <div class="quando" id="quando" hidden role="group" aria-label="Para quando?">
      <div class="qq">Para quando? <small>opcional · Enter = sem data</small></div>
      <div class="qb">
        <button type="button" data-q="hoje">Hoje</button><button type="button" data-q="amanhã">Amanhã</button>
        <button type="button" data-q="daqui a 7 dias">Em 1 semana</button>
        <input id="qOutra" type="text" maxlength="40" autocomplete="off" spellcheck="false" aria-label="Outra data" placeholder="outra data: sexta, 25/12…">
        <button type="button" class="sem" data-q="">Sem data</button>
      </div>
    </div>
    <div class="aviso" id="aviso" role="status"></div>
  </section>

  <section class="card" id="cAtalhos" aria-label="Atalhos">
    <div class="lbl"><svg class="i" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>Atalhos</div>
    <div class="tiles" id="tiles"></div>
  </section>
  </div>

  <div class="col dir">
  <section class="card" id="cHoje" aria-label="Hoje">
    <div class="lbl" id="dia">Hoje</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
  if (new URLSearchParams(location.search).has('bg')) document.body.classList.add('debug');
  const ICONS = {  // constantes (nunca dados do usuario)
    mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',
    chat: '<path d="M21 12a8 8 0 01-11.5 7.2L4 20l1-4.5A8 8 0 1121 12z"/>',
    window: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>',
    orb: '<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c3 3 3 13 0 16M12 4c-3 3-3 13 0 16"/>',
    app: '<rect x="4" y="4" width="16" height="16" rx="4"/>',
    music: '<path d="M9 18V5l11-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zM20 16a3 3 0 11-6 0 3 3 0 016 0z"/>',
    link: '<path d="M10 14a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1M14 10a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
  };
  const svg = n => `<svg class="i" viewBox="0 0 24 24">${ICONS[n] || ICONS.app}</svg>`;
  // Toda chamada tem prazo: uma resposta que nunca vem (ex.: o controle de midia do Windows travado) nao pode ficar segurando
  // as conexoes do navegador (limite de 6 por servidor), senao o painel inteiro para de falar com o Jarvis.
  const post = (path, body = {}) => fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: AbortSignal.timeout(20000) }).then(r => r.json()).catch(() => ({}));
  const get = path => fetch(path, { cache: 'no-store', signal: AbortSignal.timeout(6000) }).then(r => r.json());
  const unico = f => { let voando = false; return async (...a) => { if (voando) return; voando = true; try { return await f(...a); } finally { voando = false; } }; };  // sem consultas empilhadas
  const oculto = () => document.hidden;
  // O app flutuante fica dias aberto com esta pagina na memoria: se o painel.html mudou no disco (atualizacao do Jarvis),
  // recarrega sozinho na proxima vez que for aberto, sem precisar reiniciar o overlay.
  let versaoPagina = null;
  async function conferirVersao() {
    try {
      const v = (await get('/api/painel')).versao;
      if (typeof v !== 'number') return;
      if (versaoPagina === null) versaoPagina = v; else if (v !== versaoPagina) location.reload();

  }
  conferirVersao(); setInterval(conferirVersao, 60000);

  let status = { state: 'idle', rev: -1 }, dados = { abertas: [], concluidas: [] }, lastRev = -2, pinned = false, mostrarConc = false, sel = -1, focada = false, atalhosIds = [];
  try { pinned = localStorage.getItem('jv-pin') === '1'; } catch {}

  // ---------------------------------------------------------------- tarefas
  const hoje0 = () => { const h = new Date(); h.setHours(0, 0, 0, 0); return h; };
  const dias = p => Math.round((new Date(p + 'T00:00:00') - hoje0()) / 864e5);
  function fmtPrazo(p) {
    const k = dias(p), d = new Date(p + 'T00:00:00');
    if (k === 0) return ['hoje', 'hoje']; if (k === 1) return ['amanhã', 'amanha'];
    if (k < 0) return ['atrasada · ' + d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }), 'atras'];
    return [d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' }), ''];
  }
  function avisar(msg, erro) { const a = $('aviso'); a.textContent = msg || ''; a.className = 'aviso' + (erro ? ' erro' : ''); clearTimeout(avisar.t); if (msg) avisar.t = setTimeout(() => a.textContent = '', 3500); }

  function render() {
    const lista = $('lista'); lista.replaceChildren();
    const ab = dados.abertas; $('nAbertas').textContent = ab.length;
    if (!ab.length) lista.append(el('div', 'vazio', 'Nenhuma tarefa aberta. Digite abaixo e aperte Enter.'));
    sel = Math.min(sel, ab.length - 1);
    ab.forEach((t, i) => {
      const row = el('div', 'tarefa' + (i === sel ? ' sel' : '') + (t.prioridade === 'alta' ? ' alta' : '')); row.setAttribute('role', 'listitem');

      const corpo = el('div', 'corpo'); corpo.append(el('div', 'tx', t.texto));
      const chips = []; if (t.prioridade === 'alta') chips.push(['prioridade alta', 'alta']); if (t.prazo) chips.push(fmtPrazo(t.prazo));
      if (chips.length) { const m = el('div', 'chips'); chips.forEach(([x, c]) => m.append(el('span', 'chip ' + c, x))); corpo.append(m); }
      const rm = el('button', 'rm', '✕'); rm.type = 'button'; rm.title = 'Remover'; rm.setAttribute('aria-label', 'Remover: ' + t.texto); rm.onclick = () => remover(t);
      row.onclick = ev => { if (ev.target === row || ev.target.closest('.corpo')) { sel = i; marcar(); } };
      row.append(ck, corpo, rm); lista.append(row);
    });

    $('btnConc').hidden = !c.length; $('btnConc').textContent = (mostrarConc ? '▾ ' : '▸ ') + 'Concluídas (' + c.length + ')';
    if (mostrarConc) c.slice(0, 5).forEach(t => { const row = el('div', 'tarefa feita'); const ck = el('span', 'ck'); ck.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>'; const co = el('div', 'corpo'); co.append(el('div', 'tx', t.texto)); row.append(ck, co); lista.append(row); });
    resumoHoje();
  }
  function marcar() { document.querySelectorAll('#lista .tarefa:not(.feita)').forEach((r, i) => r.classList.toggle('sel', i === sel)); const r = document.querySelector('#lista .tarefa.sel'); if (r) r.scrollIntoView({ block: 'nearest' }); }
  async function carregar() { try { dados = await get('/api/tarefas'); render(); } catch {} }
  async function concluir(t, row) { if (row) row.classList.add('feita'); await post('/api/tarefas/concluir', { id: t.id }); await carregar(); }
  async function remover(t) { await post('/api/tarefas/remover', { id: t.id }); avisar('Removida: ' + t.texto); await carregar(); }
  // "Para quando?": se a tarefa nao traz data, o servidor devolve `pergunta` e nada e criado ate voce escolher
  // (hoje, amanha, 1 semana, outra data) ou dizer "sem data" (Enter). Tudo opcional.
  let aguardando = null;
  const fecharQuando = () => { aguardando = null; $('quando').hidden = true; $('qOutra').value = ''; };
  async function adicionar(quando) {
    const e = $('entrada'), txt = (aguardando ?? e.value).trim(); if (!txt) return;
    const corpo = { texto: txt }; if (quando !== undefined) corpo.quando = quando;
    const r = await post('/api/tarefas/adicionar', corpo);
    if (r.pergunta) {
      aguardando = txt; $('quando').hidden = false; if (r.erro) { avisar(r.mensagem, true); $('qOutra').focus(); } else $('qOutra').focus();
      return;
    }
    fecharQuando(); e.value = ''; avisar(r.mensagem || 'Não entendi.', !r.ok); await carregar(); e.focus();
  }
  $('entrada').addEventListener('input', fecharQuando);   // mudou o texto: a pergunta anterior nao vale mais
  document.querySelectorAll('#quando [data-q]').forEach(b => b.onclick = () => adicionar(b.dataset.q));
  $('qOutra').addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); adicionar($('qOutra').value.trim()); } });
  $('entrada').addEventListener('keydown', ev => {
    if (ev.key === 'Enter') { ev.preventDefault(); adicionar(aguardando !== null ? '' : undefined); }
    if (ev.key === 'ArrowDown' && dados.abertas.length) { ev.preventDefault(); sel = 0; marcar(); $('entrada').blur(); }
  });
  $('btnMais').onclick = () => $('entrada').focus();
  $('btnDesfazer').onclick = async () => { const r = await post('/api/tarefas/desfazer'); avisar(r.ok ? 'Desfeito.' : 'Nada para desfazer.', !r.ok); await carregar(); };
  $('btnConc').onclick = () => { mostrarConc = !mostrarConc; render(); };

  function resumoHoje() {
    const ab = dados.abertas, h = ab.filter(t => t.prazo && dias(t.prazo) === 0).length, a = ab.filter(t => t.prazo && dias(t.prazo) < 0).length;
    const b = $('hojeinfo'); b.replaceChildren();
    const x = el('span'); x.append(el('b', '', String(h)), document.createTextNode(h === 1 ? ' tarefa para hoje' : ' tarefas para hoje')); b.append(x);
    if (a) { b.append(document.createTextNode(' · ')); b.append(el('span', 'r', a + (a === 1 ? ' atrasada' : ' atrasadas'))); }
  }

  // ---------------------------------------------------------------- hoje (relogio + sistema)
  function tick() {
    const n = new Date(), p2 = v => String(v).padStart(2, '0');
    $('hora').textContent = p2(n.getHours()) + ':' + p2(n.getMinutes());
    $('dia').textContent = n.toLocaleDateString('pt-BR', { weekday: 'long' }).split('-')[0];
    $('data').textContent = n.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' });
    $('barra').style.width = Math.round(((n.getHours() * 60 + n.getMinutes()) / 1440) * 100) + '%';
  }
  tick(); setInterval(tick, 1000);
  const sistema = unico(async () => {
    if (oculto()) return;
    try { const s = await get('/api/sistema');
      $('bCpu').style.width = s.cpu + '%'; $('sCpu').textContent = s.cpu + '%'; $('bMem').style.width = s.mem + '%'; $('sMem').textContent = s.mem + '%';
      const h = Math.floor(s.uptime_s / 3600), m = Math.floor(s.uptime_s % 3600 / 60); $('up').textContent = 'Ligado há ' + (h ? h + 'h ' : '') + m + 'min'; } catch {}
  });
  sistema(); setInterval(sistema, 2500);

  // ---------------------------------------------------------------- clima (o servico consulta a rede so 1x por hora)
  const CLIMA = {  // constantes (nunca dados do usuario)
    sol: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    lua: '<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',
    nuvem: '<path d="M7 18a4 4 0 01-.5-8 5.5 5.5 0 0110.7 1.3A3.4 3.4 0 0117 18H7z"/>',
    'nuvem-sol': '<circle cx="8" cy="8" r="2.6"/><path d="M8 2.5v1M2.5 8h1M4.1 4.1l.7.7M11.9 4.1l-.7.7"/><path d="M9 20a3.5 3.5 0 01-.4-7 5 5 0 019.6 1.2A3 3 0 0117 20H9z"/>',
    'nuvem-lua': '<path d="M11 3.5a4.5 4.5 0 004.5 6.5A4.5 4.5 0 1111 3.5z"/><path d="M9 20a3.5 3.5 0 01-.4-7 5 5 0 019.6 1.2A3 3 0 0117 20H9z"/>',
    chuva: '<path d="M7 15a4 4 0 01-.5-8 5.5 5.5 0 0110.7 1.3A3.4 3.4 0 0117 15H7z"/><path d="M8 18l-1 2.5M12 18l-1 2.5M16 18l-1 2.5"/>',
    neblina: '<path d="M4 9h16M3 13h18M5 17h14"/>',
    tempestade: '<path d="M7 14a4 4 0 01-.5-8 5.5 5.5 0 0110.7 1.3A3.4 3.4 0 0117 14"/><path d="M12.5 12l-2.5 4h3.5l-2.5 4.5"/>',
    neve: '<path d="M7 15a4 4 0 01-.5-8 5.5 5.5 0 0110.7 1.3A3.4 3.4 0 0117 15H7z"/><path d="M8 19h.01M12 20.5h.01M16 19h.01"/>',
  };
  async function lerClima() {
    if (oculto()) return;
    let c; try { c = await get('/api/clima'); } catch { return; }
    const box = $('clima'); box.hidden = !c.ok; if (!c.ok) return;
    $('cIco').innerHTML = CLIMA[c.icone] || CLIMA.nuvem;
    box.classList.toggle('dia', c.icone === 'sol' || c.icone === 'nuvem-sol');
    $('cTemp').textContent = c.temp + '°C'; $('cTxt').textContent = c.condicao + (c.cidade ? ' · ' + c.cidade : '');
    box.title = c.atualizado ? 'Atualizado às ' + new Date(c.atualizado * 1000).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + (c.velho ? ' (sem conexão agora)' : '') : '';
  }
  lerClima(); setInterval(lerClima, 600000);

  // ---------------------------------------------------------------- uso do Claude (sessao de 5 h + semana)
  // O servico consulta o consumo do plano e guarda por 2 min; aqui so se desenha. Os horarios de reinicio sao relativos ao
  // relogio do PC, entao a contagem anda sozinha entre as consultas.
  const CORES_O = ['#4dd5ff', '#7c5cff', '#34d399', '#f0abfc', '#94a3b8', '#fbbf24'];
  let uso = null;
  const fmtDur = s => { s = Math.max(0, Math.round(s)); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? d + ' d ' + h + ' h' : h ? h + ' h ' + m + ' min' : Math.max(1, m) + ' min'; };
  const hhmm = d => d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  function quandoReinicia(ts) {
    if (!ts) return '';
    const falta = ts - Date.now() / 1000; if (falta <= 0) return 'reiniciando…';
    const d = new Date(ts * 1000), hoje = d.toDateString() === new Date().toDateString();
    return 'reinicia em ' + fmtDur(falta) + ' · ' + (hoje ? '' : d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '') + ' ') + hhmm(d);
  }
  function linhaUso(l, origens) {
    const row = el('div', 'uso-linha'), top = el('div', 'uso-topo');
    top.append(el('span', 'uso-nome', l.nome), el('span', 'uso-pct ' + l.nivel, l.pct + '%'));
    const bar = el('div', 'uso-barra'); bar.setAttribute('role', 'progressbar'); bar.setAttribute('aria-label', l.nome);
    bar.setAttribute('aria-valuemin', '0'); bar.setAttribute('aria-valuemax', '100'); bar.setAttribute('aria-valuenow', String(l.pct));
    const seg = l.id === 'weekly_all' && origens.length ? origens : null;   // a semana mostra de onde veio o gasto
    if (seg) seg.forEach((o, i) => { const s = el('i'); s.style.width = o.pct + '%'; s.style.background = CORES_O[i % CORES_O.length]; s.title = o.nome + ': ' + o.pct + '% do limite'; bar.append(s); });
    else { const s = el('i', l.nivel); s.style.width = l.pct + '%'; bar.append(s); }
    row.append(top, bar, el('div', 'uso-sub', quandoReinicia(l.reinicia)));
    if (seg) { const lg = el('div', 'uso-leg'); seg.forEach((o, i) => { const sp = el('span'); const dot = el('i'); dot.style.background = CORES_O[i % CORES_O.length]; sp.append(dot, document.createTextNode(o.nome + ' ' + o.pct + '%')); lg.append(sp); }); row.append(lg); }
    return row;
  }
  function renderUso() {
    const c = $('cUso'), u = uso; if (!u) return;
    c.hidden = !!u.desligado; if (u.desligado) return;
    const L = $('uLinhas'), nota = $('uNota'); L.replaceChildren(); nota.hidden = true; nota.classList.remove('velho');
    $('uPlano').hidden = !(u.ok && u.plano); $('uPlano').textContent = u.plano || '';
    $('uAtual').textContent = u.ok && u.atualizado ? 'atualizado ' + hhmm(new Date(u.atualizado * 1000)) : '';
    if (!u.ok) { nota.hidden = false; nota.textContent = u.motivo || 'Consumo indisponível.'; return; }
    (u.limites || []).forEach(l => L.append(linhaUso(l, u.origens || [])));
    if (u.velho) { nota.hidden = false; nota.classList.add('velho'); nota.textContent = 'Dados antigos: ' + (u.motivo || 'sem atualizar agora') }
  }
  async function lerUso() {
    if (oculto()) return;
    try { uso = await get('/api/uso'); } catch { uso = { ok: false, motivo: 'Sem resposta do Jarvis.' }; }
    renderUso();
  }
  lerUso(); setInterval(lerUso, 30000); setInterval(renderUso, 20000);

  // ---------------------------------------------------------------- musica
  let mus = { ativo: false }, musT0 = 0, capaId = null;
  const mmss = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const ICO_PLAY = '<path d="M8 5v14l11-7z"/>', ICO_PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  function renderMusica() {
    const m = mus, vivo = !!(m && m.ativo);
    ['mInfo', 'mProg', 'mCtl'].forEach(id => $(id).hidden = !vivo); $('capa').hidden = !(vivo && m.capa); $('mVazio').hidden = vivo;
    if (!vivo) {
      $('mMotivo').textContent = m && m.disponivel === false ? 'Controle de música indisponível' : 'Nada tocando';
      $('btnAbrirSpot').hidden = !atalhosIds.includes('spotify'); $('cMusica').style.setProperty('--mc', '#26334a'); capaId = null; return;
    }
    $('mApp').textContent = m.app || 'Player'; $('mDot').className = m.estado === 'tocando' ? '' : 'off';
    $('mTit').textContent = m.titulo; $('mTit').title = m.titulo; $('mArt').textContent = m.artista + (m.album ? ' · ' + m.album : '');
    $('cMusica').style.setProperty('--mc', m.cor || '#1db954');
    if (m.capa && capaId !== m.capa_id) { capaId = m.capa_id; $('capa').src = '/api/musica/capa?id=' + m.capa_id; }
    $('mPPi').innerHTML = m.estado === 'tocando' ? ICO_PAUSE : ICO_PLAY;
    $('mAnt').disabled = !m.pode.anterior; $('mProx').disabled = !m.pode.proxima; $('mPP').disabled = !m.pode.play_pause;
    $('mDur').textContent = mmss(m.duracao_s); progresso();
  }
  function progresso() {
    if (!mus.ativo) return;
    let pos = mus.posicao_s + (mus.estado === 'tocando' ? (performance.now() - musT0) / 1000 : 0); if (mus.duracao_s) pos = Math.min(pos, mus.duracao_s);
    $('mPos').textContent = mmss(pos); const pc = mus.duracao_s ? Math.min(100, pos / mus.duracao_s * 100) : 0;
    $('mFill').style.width = pc + '%'; $('mBar').setAttribute('aria-valuenow', Math.round(pc));
  }
  const lerMusica = unico(async () => { if (oculto()) return; try { mus = await get('/api/musica'); musT0 = performance.now(); renderMusica(); } catch {} });
  const ctl = acao => async () => { await post('/api/musica/acao', { acao }); setTimeout(lerMusica, 350); };
  $('mAnt').onclick = ctl('anterior'); $('mPP').onclick = ctl('play_pause'); $('mProx').onclick = ctl('proxima');
  $('btnAbrirSpot').onclick = () => post('/api/acao', { acao: 'spotify' });
  lerMusica(); setInterval(lerMusica, 1500); setInterval(progresso, 250);

  // ---------------------------------------------------------------- atalhos
  async function atalhos() {
    let lista = []; try { lista = await get('/api/atalhos'); } catch {}
    atalhosIds = lista.map(a => a.id); renderMusica();
    const box = $('tiles'); box.replaceChildren();
    for (const a of lista) {
      const b = el('button', 'tile'); b.type = 'button'; b.title = a.nome;
      const ic = el('span', 'ic'); ic.innerHTML = svg(a.icone); b.append(ic, el('span', '', a.nome));
      b.onclick = async () => { const r = await post('/api/acao', { acao: a.id }); if (r && r.mensagem) avisar(r.mensagem); if (!pinned && !['esfera', 'nova_conversa', 'falar'].includes(a.id)) fechar(); };
      box.append(b);
    }
    const add = el('button', 'tile add'); add.type = 'button'; add.title = 'Editar atalhos (abre o config.json)';
    const ic = el('span', 'ic'); ic.innerHTML = svg('plus'); add.append(ic, el('span', '', 'Adicionar'));
    add.onclick = () => post('/api/acao', { acao: 'configurar' }); box.append(add);
  }
  atalhos();

  // ---------------------------------------------------------------- jarvis (estado + esfera)
  const NOMES = { idle: 'em espera', listening: 'ouvindo', transcribing: 'entendendo', thinking: 'trabalhando', speaking: 'falando' };
  const COR = { idle: [195, 55, 66], listening: [152, 75, 62], transcribing: [46, 90, 62], thinking: [30, 92, 60], speaking: [193, 100, 68] };
  const poll = unico(async () => {
    if (oculto()) return;
    try { status = await get('/api/status'); } catch { status = { state: 'off', rev: -1 }; }
    const st = status.state || 'idle';
    $('jest').textContent = NOMES[st] || 'desligado'; $('jreply').textContent = status.reply || 'Aperte Ctrl+Alt+J e fale.';
    $('pend').hidden = !status.pending;
    const c = COR[st] || COR.idle; $('jdot').style.background = `hsl(${c[0]} ${c[1]}% ${c[2]}%)`; $('jdot').style.boxShadow = `0 0 10px hsl(${c[0]} ${c[1]}% ${c[2]}%)`;
    if (status.rev !== lastRev) { lastRev = status.rev; carregar(); }
  });
  poll(); setInterval(poll, 450);
  $('btnFalar').onclick = () => post('/api/acao', { acao: 'falar' });
  $('btnNova').onclick = async () => { await post('/api/acao', { acao: 'nova_conversa' }); avisar('Nova conversa iniciada.'); };

  const cv = $('orb'), cx = cv.getContext('2d'); const N = 420, pts = [];
  for (let i = 0; i < N; i++) { const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963229728653; pts.push([Math.cos(th) * r, y, Math.sin(th) * r, Math.random() * 6.28]); }
  let lvl = 0, rot = 0, hsl = [195, 55, 66], last = performance.now(); const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function frame(now) {
    if (oculto()) { last = now; requestAnimationFrame(frame); return; }
    const dt = Math.min(8, Math.max(.2, (now - last) / 16.7)); last = now; const k = a => 1 - Math.pow(1 - a, dt);
    const st = status.state || 'idle', work = st === 'thinking' || st === 'transcribing', t = now / 1000;
    let alvo = (st === 'listening' || st === 'speaking') ? (status.level || 0) : work ? .2 + .12 * Math.sin(t * 3.2) : .05; if (REDUCE) alvo *= .3;
    lvl += (alvo - lvl) * k(.35); rot += (work ? .016 : .004) * dt * (REDUCE ? .3 : 1);
    const c = COR[st] || COR.idle; for (let i = 0; i < 3; i++) hsl[i] += (c[i] - hsl[i]) * k(.12);
    cx.clearRect(0, 0, 156, 156); cx.fillStyle = `hsl(${hsl[0]} ${hsl[1]}% ${hsl[2]}%)`;
    const R = 52 * (1 + lvl * .25), cr = Math.cos(rot), sr = Math.sin(rot), ci = .91, si = .41;
    for (const p of pts) {
      const w = 1 + lvl * .6 * Math.sin(p[3] + t * 6 + p[1] * 5), x = p[0] * w, y = p[1] * w, z = p[2] * w;
      const x1 = x * cr + z * sr, z1 = -x * sr + z * cr, y1 = y * ci - z1 * si, z2 = y * si + z1 * ci, d = (z2 + 1.3) / 2.6;
      cx.globalAlpha = Math.max(.06, Math.min(1, .08 + .9 * d * d)); const s = .8 + 1.7 * d; cx.fillRect(78 + x1 * R - s / 2, 78 + y1 * R - s / 2, s, s);
    }
    cx.globalAlpha = 1; requestAnimationFrame(frame);
  })(last);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { conferirVersao(); poll(); lerMusica(); sistema(); lerUso(); lerClima(); carregar(); } });

  // ---------------------------------------------------------------- janela: mover, redimensionar, restaurar
  // Dentro do app Tauri a janela e nativa e sem moldura; o arrasto e o redimensionamento sao pedidos ao sistema
  // (mesma fluidez de uma janela normal). No navegador comum nada disso aparece.
  const TAURI = window.__TAURI_INTERNALS__ || null;
  const rotulo = () => (TAURI && TAURI.metadata && TAURI.metadata.currentWindow && TAURI.metadata.currentWindow.label) || 'painel';
  const nativo = (cmd, args) => { try { return Promise.resolve(TAURI.invoke('plugin:window|' + cmd, Object.assign({ label: rotulo() }, args))).catch(() => {}); } catch { return Promise.resolve(); } };
  const restaurar = () => post('/api/painel/resetar');
  if (TAURI) {
    document.body.classList.add('tauri');
    $('shell').querySelector('.top').addEventListener('mousedown', ev => {
      if (ev.button !== 0 || ev.target.closest('button') || ev.detail > 1) return;
      ev.preventDefault(); nativo('start_dragging');
    });
    document.querySelectorAll('.rz').forEach(h => h.addEventListener('mousedown', ev => {
      if (ev.button !== 0) return; ev.preventDefault(); nativo('start_resize_dragging', { value: h.dataset.d });
    }));
    $('shell').querySelector('.top').addEventListener('dblclick', ev => { if (!ev.target.closest('button')) restaurar(); });
  }
  $('btnRest').onclick = restaurar;
  if (!TAURI) $('btnRest').hidden = true;
  // pequena animacao de entrada toda vez que o painel reaparece
  let entradaT = 0;
  function entrada() { const s = $('shell'); if (REDUCE || Date.now() - entradaT < 250) return; entradaT = Date.now(); s.classList.remove('entra'); void s.offsetWidth; s.classList.add('entra'); }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) entrada(); });
  addEventListener('focus', entrada);

  // ---------------------------------------------------------------- janela: fixar, fechar, teclado
  const fechar = () => { if (!pinned) post('/api/painel/fechar'); };
  function setPin(on) { pinned = on; $('btnPin').setAttribute('aria-pressed', String(on)); $('pinTxt').textContent = on ? 'FIXADO' : ''; try { localStorage.setItem('jv-pin', on ? '1' : '0'); } catch {} }
  setPin(pinned);
  $('btnPin').onclick = () => setPin(!pinned);
  $('btnFechar').onclick = () => post('/api/painel/fechar');   // o X sempre fecha, mesmo fixado
  addEventListener('focus', () => { focada = true; if (!document.activeElement || document.activeElement === document.body) $('entrada').focus(); });
  addEventListener('blur', () => { if (focada && !pinned) setTimeout(() => { if (!document.hasFocus()) fechar(); }, 180); });
  document.addEventListener('keydown', ev => {
    const emEntrada = document.activeElement === $('entrada');
    if (ev.key === 'Escape' && !$('quando').hidden) { fecharQuando(); $('entrada').focus(); return; }
    if (ev.key === 'Escape') { if (emEntrada && $('entrada').value) { $('entrada').value = ''; return; } if (pinned) { post('/api/painel/fechar'); } else fechar(); return; }
    if (!emEntrada && ev.key === '/') { ev.preventDefault(); $('entrada').focus(); return; }
    if (emEntrada) return;
    const n = dados.abertas.length;
    if (ev.key === 'ArrowDown') { ev.preventDefault(); sel = Math.min(n - 1, sel + 1); marcar(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); if (sel <= 0) { sel = -1; marcar(); $('entrada').focus(); } else { sel--; marcar(); } }
    else if ((ev.key === ' ' || ev.key === 'Enter') && sel >= 0 && !(ev.target.closest && ev.target.closest('button'))) { ev.preventDefault(); concluir(dados.abertas[sel]); }
    else if (ev.key === 'Delete' && sel >= 0) { ev.preventDefault(); remover(dados.abertas[sel]); }
    else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); $('btnDesfazer').click(); }
  });
  carregar();
})();
</script>
